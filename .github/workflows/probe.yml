name: Probe Sheet endpoint

on: workflow_dispatch

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: GET sanity check
        run: |
          curl -sS -L -w '\n--- HTTP %{http_code} ---\n' \
            "https://script.google.com/macros/s/AKfycby139zYMNfXtbRSes0woXSzElqiqm1nf7b7LsuXG6WoRphZKd3t2AqDz1EqkJmuRqI/exec" \
            | head -c 3000
      - name: POST test submission
        run: |
          curl -sS -L -w '\n--- HTTP %{http_code} ---\n' \
            -H 'Content-Type: text/plain;charset=utf-8' \
            -d '{"name":"TEST ROW - ignore/delete","dob":"01/01/1990","city":"Test City","journey":"A founder building now","linkedin":"https://linkedin.com/in/test","email":"founder-era-probe@example.com","whatsapp":"+910000000000"}' \
            "https://script.google.com/macros/s/AKfycby139zYMNfXtbRSes0woXSzElqiqm1nf7b7LsuXG6WoRphZKd3t2AqDz1EqkJmuRqI/exec" \
            | head -c 3000
