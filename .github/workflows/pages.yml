name: Deploy to GitHub Pages

# Publishes the site by syncing this branch's content to the gh-pages
# branch, which GitHub Pages serves at:
#   https://srishtijain22.github.io/founder-era-form/

on:
  push:
    branches:
      - claude/founder-era-signup-form-6swcbu
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish to gh-pages
        run: |
          set -euo pipefail
          SITE=$(mktemp -d)
          rsync -a --exclude '.git' --exclude '.github' --exclude '.gitignore' --exclude 'apps-script.gs' ./ "$SITE/"
          touch "$SITE/.nojekyll"
          cd "$SITE"
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
